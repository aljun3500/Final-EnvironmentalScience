<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Healing Plants of the Philippines</title>
<style>
:root{--bg:#f6f5f1;--ink:#2c3e33;--mut:#6b7a70;--line:#c9cdc6;--btn:#2f4a3a;--card:#fff;--ph:#d9e2d3}
:root[data-theme=dark]{--bg:#000;--ink:#e4ece6;--mut:#8fa196;--line:#2a332d;--btn:#4f7a5f;--card:#0d110e;--ph:#16211a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
header{display:flex;gap:12px;align-items:center;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header a{font:600 20px system-ui,sans-serif;color:#3f7a50;text-decoration:none;margin-right:auto}
input,button{font:13px system-ui,sans-serif}input{padding:8px 10px;border:1px solid var(--ink);background:var(--card);color:var(--ink);width:220px}
.b{background:var(--btn);color:#fff;border:0;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.b2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.c{background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit}
.ph{aspect-ratio:4/3;background:linear-gradient(160deg,var(--ph),#9db89a);display:grid;place-items:center;font-size:44px}
.c{opacity:0;transform:translateY(60px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.3,1.15)}.c.in{opacity:1;transform:none}@media(prefers-reduced-motion:reduce){.c{opacity:1;transform:none;transition:none}}.c div.t{padding:12px}.c h3{margin:0;font-weight:400;font-size:20px}.c i{color:var(--mut);font-size:14px}
.d{display:grid;grid-template-columns:1fr 1fr;background:var(--card);min-height:560px}
.ph{overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}.d .ph img{position:absolute;inset:0}.d .ph a{z-index:1}.d .ph{aspect-ratio:auto;font-size:120px;position:relative}.d .ph a{position:absolute;top:0;left:0;width:60%;padding:18px 16px 44px;font-size:14px;color:#fff;border:0;text-shadow:0 1px 3px rgba(0,0,0,.6);background:linear-gradient(to right,rgba(0,0,0,.7),rgba(0,0,0,0))}
.info{padding:28px 32px;background:var(--bg)}.tag{background:var(--btn);color:#fff;font:12px system-ui;padding:5px 9px;display:inline-block;margin-right:6px}
.tag.w{background:#8a3b2e}h1{font-weight:400;font-size:40px;margin:16px 0 0}.sci{font-style:italic;font-size:22px;margin:0 0 20px}
.meta{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px}.meta small{display:block;color:var(--mut)}.meta span{font:13px system-ui}
details{border-top:1px solid var(--line);padding:12px 0}details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}summary:after{content:"+"}details[open] summary:after{content:"−"}
details p{margin:10px 0 0}.src{font-size:13px;color:var(--mut);margin:18px 0}
@media(max-width:760px){.d{grid-template-columns:1fr}.d .ph{min-height:240px}input{width:130px}}
</style></head><body>
<header><a href="#">Healing Plants</a><input id="q" type="search" placeholder="Search plants" aria-label="Search plants"><button class="b b2" id="th">Dark mode</button></header>
<main id="m"></main>
<script>
const D=[{"id": 1, "img": "images/indian-mallow.jpg", "sci": "Abutilon indicum", "common": "Indian Mallow", "toxic": 0, "family": "Malvaceae", "status": "Not Evaluated", "use": "Soothes and protects the alimentary tract, relieves inflammation; brings down fever; softens inflamed parts; promotes urine flow; laxative; promotes removal of mucous secretions from bronchial tubes; chronic inflammation of urethra and urinary bladder.", "names": [{"n": "Malbas", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 2, "img": "images/indian-pennywort.jpg", "sci": "Centella asiatica", "common": "Indian Pennywort", "toxic": 0, "family": "Apiaceae", "status": "Not Evaluated", "use": "Alters nutrition and excretion; promotes urine flow; reduces inflammation; gentle laxative; purifies blood; soothes nerves; local stimulant; leprosy, skin diseases, chronic ulcers, contagious sores, chronic rheumatism, piles; swellings and inflammations; checks fever; dysentery; memory tonic; hair growth and hair fall.", "names": [{"n": "Takip-kohol", "l": "Filipino"}, {"n": "Gotu kola", "l": "English"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 3, "img": "images/snake-weed.jpg", "sci": "Euphorbia hirta", "common": "Snake Weed", "toxic": 0, "family": "Euphorbiaceae", "status": "Not Evaluated", "use": "Asthma; coughs, bowel complaints, stomach ache, dysentery; acute abdominal pains; skin disease and mouth infection; stops local bleeding; snakebite antidote; eye diseases.", "names": [{"n": "Tawa-tawa", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 4, "img": "images/soya-bean.jpg", "sci": "Glycine max", "common": "Soya Bean", "toxic": 0, "family": "Fabaceae", "status": "Not Evaluated", "use": "Malnutrition; allergies; diabetes; skin and eye diseases; dandruff; laxative; promotes hair growth.", "names": [{"n": "Soya", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 5, "img": "images/aarons-rod.jpg", "sci": "Stachytarpheta indica", "common": "Aaron's Rod", "toxic": 0, "family": "Verbenaceae", "status": "Not Evaluated", "use": "Ulcers; ophthalmic problems; diarrhoea and dysentery; fevers; rheumatic inflammations; cardiac problems; expels intestinal worms; erysipelas or infectious diseases; oedema; stomach ailments.", "names": [{"n": "Kandi-kandilaan", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 6, "img": "images/ringworm-shrub.jpg", "sci": "Cassia alata", "common": "Ringworm Shrub", "toxic": 0, "family": "Fabaceae", "status": "Not Evaluated", "use": "Ringworm; cough; asthma; vermicide; eczema.", "names": [{"n": "Akapulko", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 7, "img": "images/wild-mustard.jpg", "sci": "Cleome viscosa", "common": "Wild Mustard", "toxic": 0, "family": "Brassicaceae", "status": "Not Evaluated", "use": "Expels worms; digestion; laxative; reduces inflammations; skin ailments; leprosy; blood diseases; cough; earache; cardiac stimulant.", "names": [{"n": "Mustasa", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 8, "img": "images/rose-apple.jpg", "sci": "Syzygium jambos", "common": "Rose Apple", "toxic": 0, "family": "Myrtaceae", "status": "Not Evaluated", "use": "Asthma; fatigue; dysentery; bronchitis; liver complaints; brain tonic; syphilis; sore eyes; fever.", "names": [{"n": "Tambis", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 9, "img": "images/bermuda-grass.jpg", "sci": "Cynodon dactylon", "common": "Bermuda Grass", "toxic": 0, "family": "Poaceae", "status": "Not Evaluated", "use": "Promotes urine flow; irritation of urinary organs and bladder; oedema and syphilis; checks vomiting; bleeding piles; conjunctivitis; minor cuts and wounds; rheumatism and gout; high cholesterol.", "names": [{"n": "Bakbakan", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 10, "img": "images/sensitive-plant.jpg", "sci": "Mimosa pudica", "common": "Sensitive Plant", "toxic": 0, "family": "Fabaceae", "status": "Not Evaluated", "use": "Liver disease, constipation, dysentery, kidney problems; mouth and throat inflammations; cancerous ulcers, skin diseases, glandular swellings; scorpion sting; urinary complaints; purgative; mumps.", "names": [{"n": "Makahiya", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 11, "img": "images/four-oclock.jpg", "sci": "Mirabilis jalapa", "common": "Four-O'Clock Plant", "toxic": 1, "family": "Nyctaginaceae", "status": "Not Evaluated", "use": "Promotes urine flow; inflammatory viral skin disease; abnormal liquid in cellular tissue; boils, enlarged lymph nodes, pus in a cavity; heals wounds, bruises, skin allergy from indigestion; earaches; removes freckles.", "names": [{"n": "Alas-kuwatro", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 12, "img": "images/drumstick.jpg", "sci": "Moringa oleifera", "common": "Drumstick", "toxic": 0, "family": "Moringaceae", "status": "Not Evaluated", "use": "Urinary problems; reduces inflammation; earaches; dental caries; cardiac stimulant in asthma; cough; scurvy; wounds and eye diseases; intermittent fevers, epilepsy, hysteria, palsy, rheumatism, gout, dropsy, dyspepsia, enlarged liver; paralysis.", "names": [{"n": "Malunggay", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 13, "img": "images/banana.jpg", "sci": "Musa paradisiaca", "common": "Banana", "toxic": 0, "family": "Musaceae", "status": "Not Evaluated", "use": "Root: liver congestion tonic, scurvy, glandular and venereal disease, anaemia, diarrhoea. Stem: ulcer, thirst in cholera, nervous disorders, hysteria, dysentery, jaundice, opium poisoning antidote, bleeding wounds, asthma, inflamed kidneys, hair loss, piles. Leaves: eye inflammation, wounds and ulcers, headaches, blisters. Flowers: excessive menstrual bleeding, diabetes, earaches. Fruit: diabetes, spitting of blood, diarrhoea, indigestion, flatulence, scurvy, urine flow, gentle laxative, sore throat, chest congestion, dysentery, anaemia, inflamed colon, rectal diseases.", "names": [{"n": "Saging", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 14, "img": "images/sweet-basil.jpg", "sci": "Ocimum basilicum", "common": "Sweet Basil", "toxic": 0, "family": "Lamiaceae", "status": "Not Evaluated", "use": "Relieves gas in stomach/intestines, stimulates appetite; prevents sudden muscle contractions; increases milk secretion during lactation; strengthens the stomach; removes bronchial mucus; soothes alimentary tract; diarrhoea, dysentery, chronic constipation; whooping cough; bowel complaints in children; intestinal problems, stomach cramps, vomiting.", "names": [{"n": "Sangig", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 15, "img": "images/phyllanthus.jpg", "sci": "Phyllanthus fraternus", "common": "Phyllanthus", "toxic": 0, "family": "Phyllanthaceae", "status": "Not Evaluated", "use": "Promotes urine flow; tones the stomach; promotes menstrual flow; reduces fever; mild laxative; eliminates kidney and gall stones; kidney colic; cystitis; dropsy; prostate problems; urogenital diseases; early jaundice; indigestion, dysentery, gonorrhoea; diabetes, sores, fevers.", "names": [{"n": "Sampa-sampalukan", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 16, "img": "images/purslane.jpg", "sci": "Portulaca oleracea", "common": "Purslane", "toxic": 0, "family": "Portulacaceae", "status": "Not Evaluated", "use": "Liver, kidney and bladder problems; scurvy; increases milk flow in nursing mothers; painful urination; dry coughs, shortness of breath, thirst; inflamed eyes, mouth sores, swollen gums; loose teeth; burns; hastens wound healing; promotes urine and menstrual flow; expels intestinal worms; digestion.", "names": [{"n": "Gulasiman", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 17, "img": "images/mexican-daisy.jpg", "sci": "Tridax procumbens", "common": "Mexican Daisy", "toxic": 0, "family": "Asteraceae", "status": "Not Evaluated", "use": "Checks haemorrhage of wounds; bronchial catarrh; dysentery and diarrhoea.", "names": [{"n": "Bulak-manok", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 18, "img": "images/ivory-tree.jpg", "sci": "Wrightia tomentosa", "common": "Ivory Tree", "toxic": 0, "family": "Ebenaceae", "status": "Not Evaluated", "use": "Menstrual and renal complaints; fever.", "names": [{"n": "Bantolinao", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 19, "img": "images/soursop.jpg", "sci": "Annona muricata", "common": "Soursop", "toxic": 1, "family": "Annonaceae", "status": "Not Evaluated", "use": "Kidney problems; increases perspiration and used to cause vomiting; spasms; dysentery; scurvy; constipation, obesity, hypertension, coronary disease, diabetes.", "names": [{"n": "Guyabano", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}, {"id": 20, "img": "images/custard-apple.jpg", "sci": "Annona squamosa", "common": "Custard Apple", "toxic": 1, "family": "Annonaceae", "status": "Not Evaluated", "use": "Anaemia; causes vomiting; dandruff; indigestion; relieves fainting spells; vermicidal and insecticidal; strong laxative.", "names": [{"n": "Atis", "l": "Filipino"}], "regions": ["Luzon", "Visayas", "Mindanao", "Palawan"]}],m=document.getElementById('m'),q=document.getElementById('q');
const H=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function list(){const t=q.value.toLowerCase();const r=D.filter(p=>(p.sci+p.common+p.use+p.names.map(n=>n.n).join()).toLowerCase().includes(t));
m.innerHTML=r.length?'<div class="grid">'+r.map(p=>`<a class="c" href="#${p.id}"><div class="ph">${p.img?`<img src="${p.img}" alt="${H(p.common)}" loading="lazy">`:'🌿'}</div><div class="t"><h3>${H(p.common)}</h3><i>${H(p.sci)}</i></div></a>`).join('')+'</div>':'<p>No plants match your search. Try a common name, a local name or an ailment.</p>'}
function show(p){m.innerHTML=`<div class="d"><div class="ph">${p.img?`<img src="${p.img}" alt="${H(p.common)}" loading="lazy">`:'🌿'}<a class="b b2" href="#">← Back to plants</a></div><div class="info">
<span class="tag">Medicinal plant</span>${p.toxic?'<span class="tag w">Toxic</span>':''}<h1>${H(p.common)}</h1><p class="sci">${H(p.sci)}</p>
<div class="meta"><span><small>Family</small>${H(p.family)}</span><span><small>Local names</small>${p.names.map(n=>H(n.n)+' ('+n.l+')').join(', ')}</span><span><small>Conservation</small>${H(p.status)}</span></div>
<details open><summary>Medicinal use</summary><p>${H(p.use)}</p></details>
<details><summary>Distribution</summary><p>${p.regions.join(', ')}</p></details>
<details><summary>More information</summary><p>Source: Amazing Healing Plants by Dr. JC Kurian. Images: Dr. JC Kurian and Roshan Raphael.</p></details>
<p class="src">Traditional uses only. Not medical advice.</p>${p.toxic?'<p class="src"><b>Toxic:</b> handle with care.</p>':''}</div></div>`}
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.15});
function fade(){document.querySelectorAll('.c').forEach(c=>io.observe(c))}
function route(){const p=D.find(x=>'#'+x.id==location.hash);p?show(p):(list(),fade());scrollTo(0,0)}
q.oninput=()=>{location.hash='';list();fade()};addEventListener('hashchange',route);
const th=document.getElementById('th');th.onclick=()=>{const d=document.documentElement.dataset.theme=='dark';document.documentElement.dataset.theme=d?'':'dark';th.textContent=d?'Dark mode':'Light mode'};
route();
</script></body></html>
